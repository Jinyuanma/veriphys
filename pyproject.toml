[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriphys"
version = "0.1.0"
description = "A Lean-verified classical mechanics prototype"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
veriphys = "veriphys.cli:main"
veriphys-gui = "veriphys.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
